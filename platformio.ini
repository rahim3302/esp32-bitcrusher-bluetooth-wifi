[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv

; Build only the single Arduino firmware entry point and the portable DSP module.
build_src_filter =
    +<main.cpp>
    +<bitcrusher.c>

lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12

